name: padel-engine

# Moteur d'automatisation : prépare les invitations/relances en aperçu et alimente le journal.
# Il N'ENVOIE RIEN (aucun connecteur d'envoi n'est branché). Secret requis : DATABASE_URL (Neon).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: padel-engine        # jamais deux passages en même temps
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m padel.engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
