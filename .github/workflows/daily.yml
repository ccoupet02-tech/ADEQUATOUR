name: padel-daily

# Routine quotidienne : tâches manquantes, participants Typeform, synthèses Notion, digest des retards.
# Aucun mail n'est envoyé (pas de --send) : le digest part seulement si vous l'ajoutez ci-dessous.
on:
  schedule:
    - cron: "30 5 * * 1-5"   # 05h30 UTC, du lundi au vendredi
  workflow_dispatch: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m padel daily --apply
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EVENTS_DB: ${{ secrets.NOTION_EVENTS_DB }}
          NOTION_TASKS_DB: ${{ secrets.NOTION_TASKS_DB }}
          NOTION_PARTICIPANTS_DB: ${{ secrets.NOTION_PARTICIPANTS_DB }}
          TYPEFORM_TOKEN: ${{ secrets.TYPEFORM_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
